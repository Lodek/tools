[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pm"
version = "0.1.0"
description = "Project metadata manager"
requires-python = ">=3.10"
dependencies = ["click>=8.0"]

[project.scripts]
pm = "pm.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pm = ["shell.zsh"]
